<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Roblox OS banner</title>
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 264px;
    overflow: hidden;
    background: #0c0d10;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 264px;
    background:
      radial-gradient(ellipse 55% 90% at 22% 40%, rgba(226, 35, 26, 0.28), transparent 60%),
      radial-gradient(ellipse 50% 120% at 82% 50%, rgba(42, 48, 62, 0.55), transparent 60%),
      linear-gradient(90deg, #0c0d10 0%, #101117 45%, #0c0d10 100%);
  }
  .grid {
    position: absolute;
    left: 40%; right: -5%; top: -40%; bottom: -80%;
    background-image:
      linear-gradient(rgba(200, 204, 212, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 204, 212, 0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(58deg) rotateZ(-8deg);
    mask-image: linear-gradient(to right, transparent, #000 30%);
  }
  .vignette {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(12,13,16,.15), transparent 30% 70%, rgba(12,13,16,.4)),
      radial-gradient(ellipse at center, transparent 55%, rgba(8,9,12,.5) 100%);
    z-index: 40;
    pointer-events: none;
  }

  .win {
    position: absolute;
    background: rgba(22, 23, 28, 0.9);
    border: 1px solid rgba(200, 204, 212, 0.16);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .tb {
    height: 22px;
    background: #16171c;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 8px;
    border-bottom: 1px solid rgba(200,204,212,.08);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.r { background: #E2231A; }
  .dot.s { background: #c8ccd4; opacity: .4; }
  .tb .label {
    margin-left: 4px;
    font-family: system-ui, sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: #c8ccd4;
    opacity: .65;
  }
  .win.studio {
    width: 210px; height: 148px;
    right: 86px; top: 28px;
    transform: rotate(5deg);
    z-index: 6;
  }
  .viewport {
    height: 108px;
    margin: 8px;
    border-radius: 8px;
    background:
      radial-gradient(circle at 50% 60%, rgba(226,35,26,.4), transparent 52%),
      linear-gradient(160deg, #14151b, #0c0d10);
    display: flex; align-items: center; justify-content: center;
  }
  .iso { width: 58px; height: 54px; position: relative; }
  .iso .top, .iso .left, .iso .right { position: absolute; width: 34px; height: 28px; }
  .iso .top { background: #c8ccd4; transform: translate(12px, 2px) rotate(-30deg) skewX(-30deg) scaleY(0.86); border-radius: 3px; opacity: .9; }
  .iso .left { background: #E2231A; transform: translate(1px, 16px) rotate(30deg) skewY(-30deg) scaleX(0.86); border-radius: 3px; }
  .iso .right { background: #9a1712; transform: translate(24px, 16px) rotate(-30deg) skewY(30deg) scaleX(0.86); border-radius: 3px; }

  .win.explorer {
    width: 176px; height: 118px;
    right: 310px; top: 18px;
    transform: rotate(-6deg);
    z-index: 5;
  }
  .folders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
  .folder { height: 36px; border-radius: 6px; background: #1c1d24; }

  /* Avatars — scenery on the right, may sit in overlay strips */
  .crew {
    position: absolute;
    right: 40px;
    bottom: 8px;
    display: flex;
    align-items: flex-end;
    gap: 18px;
    z-index: 8;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.5));
  }
  .avatar { position: relative; }
  .avatar .head {
    width: 36px; height: 36px; border-radius: 7px;
    background: linear-gradient(160deg, #ffe17a, #f0b429 70%);
    margin: 0 auto;
    box-shadow: inset -5px -6px 0 rgba(0,0,0,.12);
    position: relative; z-index: 2;
  }
  .eye { position: absolute; top: 12px; width: 5px; height: 8px; background: #1a1208; border-radius: 1px; }
  .eye.l { left: 8px; } .eye.r { right: 8px; }
  .smile { position: absolute; left: 12px; right: 12px; bottom: 8px; height: 5px; border: 2px solid #1a1208; border-top: 0; border-radius: 0 0 6px 6px; }
  .torso {
    width: 34px; height: 34px; margin: 2px auto 0; border-radius: 5px;
    box-shadow: inset -6px -7px 0 rgba(0,0,0,.16);
  }
  .arm {
    position: absolute; top: 40px; width: 11px; height: 30px; border-radius: 4px;
    background: linear-gradient(160deg, #ffe17a, #e0a61f);
  }
  .arm.l { left: -4px; transform: rotate(10deg); }
  .arm.r { right: -4px; transform: rotate(-10deg); }
  .leg {
    position: absolute; top: 74px; width: 13px; height: 26px; border-radius: 4px; background: #3d4250;
  }
  .leg.l { left: 8px; } .leg.r { right: 8px; }
  .red .torso { background: linear-gradient(160deg, #ff4a42, #E2231A); }
  .blue .torso { background: linear-gradient(160deg, #5aa4ff, #2b6fe0); }
  .green .torso { background: linear-gradient(160deg, #5ee09a, #1fa862); }
  .purple .torso { background: linear-gradient(160deg, #c084fc, #7c3aed); }
  .sm { transform: scale(.85); }

  /* Lockup: left-most 50% × top-most 80%, raised above midline */
  .lockup {
    position: absolute;
    left: 44px;
    top: 16px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .gem-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .gem {
    width: 22px; height: 22px;
    background: linear-gradient(145deg, #ff4e44, #E2231A 55%, #b11610);
    border-radius: 7px;
    transform: rotate(-18deg);
    box-shadow:
      0 0 18px rgba(226, 35, 26, .85),
      inset 0 0 0 5px #16171c;
    flex: none;
  }
  .word {
    font-family: "Archivo Black", sans-serif;
    font-size: 54px;
    line-height: 0.86;
    letter-spacing: 0.05em;
    color: #f2f3f5;
    text-shadow:
      0 0 16px rgba(226, 35, 26, 0.35),
      0 2px 0 #8d8f96,
      0 8px 18px rgba(0,0,0,.55);
    margin: 0;
  }
  .word.os {
    font-size: 42px;
    letter-spacing: 0.28em;
    color: #E2231A;
    text-indent: 0.12em;
    text-shadow:
      0 0 20px rgba(226, 35, 26, 0.75),
      0 2px 0 #7a120e,
      0 8px 18px rgba(0,0,0,.5);
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>

    <div class="win explorer">
      <div class="tb">
        <span class="dot r"></span><span class="dot s"></span><span class="dot s"></span>
        <span class="label">Places</span>
      </div>
      <div class="folders">
        <div class="folder"></div><div class="folder"></div><div class="folder"></div>
        <div class="folder"></div><div class="folder"></div><div class="folder"></div>
      </div>
    </div>

    <div class="win studio">
      <div class="tb">
        <span class="dot r"></span><span class="dot s"></span><span class="dot s"></span>
        <span class="label">Studio</span>
      </div>
      <div class="viewport">
        <div class="iso"><div class="top"></div><div class="left"></div><div class="right"></div></div>
      </div>
    </div>

    <div class="crew">
      <div class="avatar blue sm">
        <div class="head"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="torso"></div>
        <div class="leg l"></div><div class="leg r"></div>
      </div>
      <div class="avatar green">
        <div class="head"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="torso"></div>
        <div class="leg l"></div><div class="leg r"></div>
      </div>
      <div class="avatar red">
        <div class="head"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="torso"></div>
        <div class="leg l"></div><div class="leg r"></div>
      </div>
      <div class="avatar purple sm">
        <div class="head"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
        <div class="arm l"></div><div class="arm r"></div>
        <div class="torso"></div>
        <div class="leg l"></div><div class="leg r"></div>
      </div>
    </div>

    <div class="lockup">
      <div class="gem-row"><div class="gem"></div></div>
      <p class="word">ROBLOX</p>
      <p class="word os">OS</p>
    </div>

    <div class="vignette"></div>
  </div>
</body>
</html>
